name: CI

# triggers pipeline when push is made to any branch (typical CI pipeline rule)
on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      # save report in json format
      run: bandit -ll -ii -r . -f json -o bandit-report.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      # execute this step no matter of previous status
      with:
        # how artifacts will be named when exported
        name: bandit-findings
        path: bandit-report.json

  image_scan:
    # each new job runs in a new isolated environment
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -f Dockerfile -t mytestapp:latest .

    - name: Docker Scout Scan
      uses: docker/scout-action@v1.15.1
      with:
        dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
        command: quickview,cves
        only-severities: critical,high
        sarif-file: scout-report.sarif
        # exit code by default is true which means 0, add true to produce non success
        exit-code: true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-findings
        path: scout-report.sarif

  dast_scan:
    # no `needs` on purpose: sast_scan and image_scan are expected to fail on
    # found vulnerabilities, and DAST does not consume their reports anyway -
    # it tests the running application, so it must run regardless of them
    name: Deploy PyGoat and Run DAST Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build PyGoat image from this repository
      run: docker build -f Dockerfile -t pygoat-dast:latest .

    - name: Deploy PyGoat
      run: docker run -d -p 8000:8000 --name pygoat pygoat-dast:latest

    - name: Run database migrations
      # the image CMD starts gunicorn without migrating the database
      # (docker-compose does it in a separate service), so do it here
      run: docker exec pygoat python manage.py migrate --noinput

    - name: Wait until the application responds
      # the built-in Dockerfile HEALTHCHECK is commented out, so poll manually
      run: |
        for i in $(seq 1 24); do
          if curl -sf http://localhost:8000/ >/dev/null; then
            echo "PyGoat is up"
            exit 0
          fi
          sleep 5
        done
        echo "::error::PyGoat did not become ready in 120s"
        docker logs pygoat
        exit 1

    - name: OWASP ZAP Baseline Scan
      # runs ZAP with --network host, so http://localhost:8000 is reachable;
      # the job fails on High alerts, which is expected for a vulnerable app
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:8000'
        cmd_options: '-a'

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      # keep the report even when the scan step above exits non-zero
      with:
        name: zap-report
        path: |
          report_html.html
          report_json.json
          report_md.md
